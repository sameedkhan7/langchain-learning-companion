[project]
name = "learning-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.6",
    "langchain-xai>=1.3.0",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
